apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-app

resources:
  - ../../base
  - ingress.yaml

images:
  - name: backend
    newName: PLACEHOLDER_BACKEND_IMAGE # overwritten by CI: kustomize edit set image
  - name: frontend
    newName: PLACEHOLDER_FRONTEND_IMAGE

replicas:
  - name: backend
    count: 2
  - name: frontend
    count: 2
